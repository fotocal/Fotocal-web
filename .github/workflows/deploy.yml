name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          # tools/indexnow.py compares this push with the last one
      - name: Setup Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      # src/ holds the bilingual templates; the two rendered trees (Spanish
      # at /, English at /en/) are generated from them. Rendering here as
      # well as locally means the published site can never lag the source,
      # and a builder error fails the deploy instead of shipping half a site.
      - name: Render both language trees
        run: python3 tools/build_site.py

      # Build inputs must not be published. Left in place, src/ would serve
      # 71 untranslated duplicates of every page at /src/… — the exact
      # duplicate-content problem the two-tree split exists to avoid —
      # and tools/ holds raw phone captures, working notes and scripts.
      # README.md and deploy-trigger.txt are repository housekeeping, not
      # site pages. (This step only protects the deploy made by THIS
      # workflow: while the repository's Pages source is still "Deploy from
      # a branch", GitHub also publishes the raw branch on every push and
      # the later of the two wins. Settings → Pages → Source → GitHub
      # Actions ends that.)
      # Keep the IndexNow script: tools/ leaves the artifact next. It runs
      # after the deploy (last step), so IndexNow fetches the new version;
      # the changed pages come from git history, which the deletion leaves alone.
      - name: Keep the IndexNow script
        run: cp tools/indexnow.py /tmp/indexnow.py

      - name: Drop build-only files from the artifact
        run: rm -rf src tools docs .github README.md deploy-trigger.txt .gitignore

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # IndexNow (Bing, Yandex and others): a free hint that these pages
      # changed. Never fails the deploy.
      - name: Ping IndexNow
        if: success()
        continue-on-error: true
        run: python3 /tmp/indexnow.py ${{ github.event.before }} ${{ github.sha }}
