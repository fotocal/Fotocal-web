<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <title>Fotocal</title>
  <!-- The Fotocal mark. Embedded as a data URI on purpose: an SVG
       favicon may not fetch external images, and every page already
       points at this one file, so the logo updates everywhere
       without touching any page markup.
       Regenerate with tools/make_icons.py — do not hand-edit. -->
  <image width="96" height="96" href="data:image/png;base64,"/>
</svg>
