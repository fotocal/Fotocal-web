<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting</title>
  <meta name="description" content="This page has moved to the features overview.">
  <meta name="robots" content="noindex, follow">
  <!-- The recipe feature was removed from the app (September 2026). GitHub
       Pages cannot issue a 301, so this stub sends the old URL on to
       /features/ the only way it can: a meta refresh, noindex, and no
       sitemap entry. The relative target resolves in both language trees. -->
  <meta http-equiv="refresh" content="0; url=../">
</head>
<body>
  <p data-lang-block="es"><a href="../">Ir a las funciones de Fotocal →</a></p>
  <p data-lang-block="en" hidden><a href="../">Continue to Fotocal features →</a></p>
</body>
</html>
