# Lives at .github/workflows/preview.yml in the fotocal/fotocal.github.io
# repository (this is the reference copy). Builds the preview of the
# web-redesign branch of fotocal/Fotocal-web at https://fotocal.github.io/
#
# Triggers: every 10 minutes (skipped when the branch has not moved) and
# on demand. The live site's own workflow is untouched — it only runs on
# pushes to main of Fotocal-web, and this one never writes there.
name: Preview web-redesign

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: preview
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - name: Check out web-redesign
        uses: actions/checkout@v4
        with:
          repository: fotocal/Fotocal-web
          ref: web-redesign
          path: site

      - name: Skip if the preview already shows this commit
        id: check
        run: |
          sha=$(git -C site rev-parse HEAD)
          live=$(curl -fsSL --max-time 15 https://fotocal.github.io/.preview-sha 2>/dev/null || echo none)
          echo "branch $sha / preview $live"
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$sha" = "$live" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Render both language trees
        if: steps.check.outputs.changed == 'true'
        run: python3 site/tools/build_site.py

      - name: Prepare the preview (noindex, no CNAME, no sitemap)
        if: steps.check.outputs.changed == 'true'
        run: bash site/tools/preview/prepare.sh site out "${{ steps.check.outputs.sha }}"

      - name: Setup Pages
        if: steps.check.outputs.changed == 'true'
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload preview
        if: steps.check.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    if: needs.build.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
